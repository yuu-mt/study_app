<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景（丸） -->
  <circle cx="50" cy="50" r="50" fill="#2563eb"/>
  <!-- タイマー円 -->
  <circle cx="50" cy="50" r="36" fill="white" opacity="0.15"/>
  <circle cx="50" cy="50" r="30" fill="white" opacity="0.1"/>
  <!-- M文字 -->
  <text x="50" y="48" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">M</text>
  <!-- 牙 -->
  <polygon points="30,78 38,66 46,78" fill="#2563eb"/>
  <polygon points="54,78 62,66 70,78" fill="#2563eb"/>
  <!-- 針（分針） -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 針（時針） -->
  <line x1="50" y1="50" x2="66" y2="58" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <!-- 中心 -->
  <circle cx="50" cy="50" r="3" fill="#fbbf24"/>
</svg>
